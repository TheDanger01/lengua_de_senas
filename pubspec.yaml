name: TDLDS
description: "Lengua de Señas"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  #Mediapipe, para deteccion de manos
  google_mlkit_pose_detection: ^0.14.0 #0.11.0
  hand_landmarker: ^2.1.0
  #Acceso a Sistema de Archivos
  path_provider: ^2.0.11
  cupertino_icons: ^1.0.8
  #Camara y Video
  image_picker: ^1.1.2
  video_player: ^2.6.1
  video_thumbnail: ^0.5.6
  screenshot: ^3.0.0
  #Procesamiento de Video FFMPEG para extraer Frames
  #flutter_ffmpeg: ^0.4.0
  #ffmpeg_kit_flutter: ^6.0.3
  ffmpeg_kit_flutter_minimal: ^6.0.8
  #Prediccion de Video con TensorFlow Lite
  tflite_flutter: ^0.11.0
  #tflite_flutter_helper: ^0.3.1
  #Procesamiento de Imágenes
  image: ^4.5.4
  #Permisos de Camara y Almacenamiento
  permission_handler: ^12.0.1
  yaml: ^3.1.2
  #Duracion Video
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Icono de la Aplicacion
  flutter_launcher_icons: ^0.14.4

# Colocar el icono de la aplicacion
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/ModeloV4_200Epoch_float16.tflite
